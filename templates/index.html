<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITAN-X OMEGA MERKEZI</title>
  <style>
    :root {
      --bg: #070a13;
      --panel: #03050a;
      --line: #00ffcc;
      --line-soft: #1a2333;
      --user-bg: #141f33;
      --user-line: #2a3d5e;
      --ai-bg: #061513;
      --ai-line: #00ffcc;
      --danger: #ff5f5f;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: #00ffcc;
      font-family: monospace;
    }

    body {
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--panel);
      padding: 14px 16px;
      border-bottom: 2px solid var(--line);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      text-shadow: 0 0 10px #00ffcc;
    }

    .status-row {
      width: 100%;
      font-size: 11px;
      color: #0f0;
      letter-spacing: 1px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-row.hidden {
      display: none;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .toggle-btn {
      border: 1px solid #00ffcc;
      background: #0b111c;
      color: #00ffcc;
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 11px;
      font-family: monospace;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: #00ffcc;
      color: #000;
      font-weight: bold;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      overflow: hidden;
    }

    .workspace.people-hidden {
      grid-template-columns: minmax(0, 1fr);
    }

    .chat-wrap {
      min-height: 0;
      border-right: 1px solid var(--line-soft);
      overflow: hidden;
    }

    .workspace.people-hidden .chat-wrap {
      border-right: 0;
    }

    #chat {
      height: 100%;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scrollbar-gutter: stable;
    }

    #chat::-webkit-scrollbar,
    #people-list::-webkit-scrollbar {
      width: 10px;
    }

    #chat::-webkit-scrollbar-track,
    #people-list::-webkit-scrollbar-track {
      background: #09101d;
      border-radius: 20px;
    }

    #chat::-webkit-scrollbar-thumb,
    #people-list::-webkit-scrollbar-thumb {
      background: #3e5c86;
      border-radius: 20px;
    }

    .msg {
      padding: 15px;
      border-radius: 8px;
      max-width: 85%;
      font-size: 14px;
      word-wrap: break-word;
      line-height: 1.5;
    }

    .user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid var(--user-line);
      color: #8bb4f7;
      border-bottom-right-radius: 0;
    }

    .ai {
      align-self: flex-start;
      background: var(--ai-bg);
      border: 1px solid var(--ai-line);
      color: #e0ffff;
      border-bottom-left-radius: 0;
    }

    .error {
      border-color: var(--danger);
      color: #ff9f9f;
    }

    .isim {
      font-weight: bold;
      font-size: 11px;
      margin-bottom: 8px;
      display: block;
      opacity: 0.85;
    }

    .user .isim { color: #58a6ff; }
    .ai .isim { color: #00ffcc; }

    .people {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: #050a14;
    }

    .workspace.people-hidden .people {
      display: none;
    }

    .people-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 12px;
      color: #9ee2d2;
      letter-spacing: 1px;
    }

    .people-count {
      border: 1px solid #00ffcc66;
      border-radius: 999px;
      padding: 2px 8px;
      color: #00ffcc;
    }

    #people-list {
      margin: 0;
      padding: 10px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      min-height: 0;
    }

    .person {
      background: #0b1626;
      border: 1px solid #1f3553;
      border-radius: 7px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      color: #c6dcff;
      font-size: 12px;
    }

    .person .online {
      color: #00ffcc;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .panel {
      background: var(--panel);
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--line-soft);
    }

    input {
      flex: 1;
      background: #0b111c;
      border: 1px solid #00ffcc;
      color: #00ffcc;
      padding: 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }

    button.send {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 0 25px;
      border-radius: 6px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      transition: 0.2s;
    }

    button.send:active { transform: scale(0.95); }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) 180px;
      }

      .chat-wrap {
        border-right: 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .workspace.people-hidden {
        grid-template-rows: minmax(0, 1fr);
      }

      .msg { max-width: 95%; }

      .panel {
        padding: 10px;
      }

      button.send {
        padding: 0 16px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TITAN-X OMEGA</h1>
    <div class="actions">
      <button id="toggle-status" class="toggle-btn" type="button">SISTEM GIZLE</button>
      <button id="toggle-people" class="toggle-btn active" type="button">KISILER ACIK</button>
    </div>
    <div id="status-row" class="status-row">SUNUCU: VERCEL • MIMARI: AYRIK • DURUM: KONTROL EDILIYOR</div>
  </div>

  <div id="workspace" class="workspace">
    <div class="chat-wrap">
      <div id="chat">
        <div class="msg ai"><span class="isim">SISTEM</span>Sunucu devrede. Emirlerini bekliyorum Patron.</div>
      </div>
    </div>

    <aside class="people">
      <div class="people-head">
        <span>ODADAKI BAGLI KISILER</span>
        <span id="people-count" class="people-count">0</span>
      </div>
      <ul id="people-list"></ul>
    </aside>
  </div>

  <div class="panel">
    <input type="text" id="komut" placeholder="Emret..." onkeypress="if(event.key === 'Enter') gonder()">
    <button id="send-btn" class="send" onclick="gonder()">GONDER</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("komut");
    const sendBtn = document.getElementById("send-btn");
    const statusRow = document.getElementById("status-row");
    const peopleList = document.getElementById("people-list");
    const peopleCount = document.getElementById("people-count");
    const workspace = document.getElementById("workspace");
    const toggleStatusBtn = document.getElementById("toggle-status");
    const togglePeopleBtn = document.getElementById("toggle-people");

    const participants = new Set(["CEO SENOL", "TITAN-X"]);

    function kisiListeYenile() {
      peopleList.textContent = "";
      const list = Array.from(participants);
      peopleCount.textContent = String(list.length);

      for (const name of list) {
        const item = document.createElement("li");
        item.className = "person";

        const nameEl = document.createElement("span");
        nameEl.textContent = name;

        const stateEl = document.createElement("span");
        stateEl.className = "online";
        stateEl.textContent = "ONLINE";

        item.append(nameEl, stateEl);
        peopleList.appendChild(item);
      }
    }

    function mesajEkle(kind, author, text, isError = false) {
      const msg = document.createElement("div");
      msg.className = `msg ${kind}`;
      if (isError) msg.classList.add("error");

      const ad = document.createElement("span");
      ad.className = "isim";
      ad.textContent = author;

      const body = document.createElement("div");
      body.textContent = text;

      msg.append(ad, body);
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function toggleStatus() {
      const hidden = statusRow.classList.toggle("hidden");
      toggleStatusBtn.textContent = hidden ? "SISTEM GOSTER" : "SISTEM GIZLE";
    }

    function togglePeople() {
      const hidden = workspace.classList.toggle("people-hidden");
      togglePeopleBtn.classList.toggle("active", !hidden);
      togglePeopleBtn.textContent = hidden ? "KISILER KAPALI" : "KISILER ACIK";
    }

    async function sistemDurumuKontrol() {
      try {
        const res = await fetch("/api/health", { cache: "no-store" });
        if (!res.ok) throw new Error("health hata");

        const data = await res.json();
        statusRow.textContent = `SUNUCU: VERCEL • MODEL: ${data.model} • DURUM: HAZIR`;

        if (Array.isArray(data.participants)) {
          for (const name of data.participants) {
            const temiz = String(name || "").trim();
            if (temiz) participants.add(temiz);
          }
          kisiListeYenile();
        }
      } catch (_) {
        statusRow.textContent = "SUNUCU: VERCEL • DURUM: BAGLANTI SORUNU";
      }
    }

    async function gonder() {
      const metin = input.value.trim();
      if (!metin) return;

      input.value = "";
      mesajEkle("user", "CEO SENOL", metin);
      participants.add("CEO SENOL");
      kisiListeYenile();

      sendBtn.disabled = true;
      const loadingId = `b_${Date.now()}`;

      const loading = document.createElement("div");
      loading.className = "msg ai";
      loading.id = loadingId;
      loading.innerHTML = "<span class='isim'>TITAN-X</span>Isleniyor...";
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      try {
        const istek = await fetch("/api/sor", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ msg: metin })
        });

        const yanit = await istek.json();
        document.getElementById(loadingId)?.remove();

        if (!istek.ok) {
          const hata = yanit.error || yanit.detail || "Sunucu hatasi";
          mesajEkle("ai", "HATA", hata, true);
          return;
        }

        participants.add("TITAN-X");
        kisiListeYenile();
        mesajEkle("ai", "TITAN-X", yanit.cevap || "Bos cevap dondu.");
      } catch (_) {
        document.getElementById(loadingId)?.remove();
        mesajEkle("ai", "HATA", "Sunucu baglantisi koptu.", true);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    toggleStatusBtn.addEventListener("click", toggleStatus);
    togglePeopleBtn.addEventListener("click", togglePeople);

    if (window.innerWidth <= 900) {
      togglePeople();
    }

    kisiListeYenile();
    sistemDurumuKontrol();
    input.focus();
  </script>
</body>
</html>
