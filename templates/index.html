<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TITAN Ultimate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #071119;
      --bg-surface: #0f1e2d;
      --bg-card: #152c42;
      --line-soft: rgba(114, 160, 201, 0.32);
      --line-strong: rgba(147, 188, 224, 0.65);
      --text-main: #eaf6ff;
      --text-muted: #abc0d8;
      --accent: #2ad59e;
      --accent-strong: #1fb380;
      --danger: #ff7777;
      --radius: 16px;
      --shadow: 0 22px 50px rgba(1, 6, 12, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      color: var(--text-main);
      background:
        radial-gradient(circle at 10% 12%, rgba(43, 89, 140, 0.42), transparent 48%),
        radial-gradient(circle at 82% 8%, rgba(42, 213, 158, 0.22), transparent 40%),
        linear-gradient(165deg, #050b12 0%, var(--bg-main) 58%, #081b2a 100%);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
    }

    body {
      padding: clamp(10px, 2vw, 24px);
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .app {
      width: min(1120px, 100%);
      height: calc(100dvh - clamp(20px, 4vw, 48px));
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      border: 1px solid var(--line-soft);
      border-radius: calc(var(--radius) + 4px);
      background: linear-gradient(180deg, rgba(14, 29, 46, 0.95), rgba(9, 20, 32, 0.96));
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line-soft);
      background: linear-gradient(100deg, rgba(22, 49, 76, 0.75), rgba(10, 34, 26, 0.75));
    }

    .brand h1 {
      margin: 0;
      letter-spacing: 0.02em;
      font-size: clamp(1rem, 1.9vw, 1.3rem);
      font-weight: 700;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--text-muted);
      font-size: 0.83rem;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ghost-btn {
      border: 1px solid var(--line-strong);
      background: rgba(16, 37, 55, 0.82);
      color: var(--text-main);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 0.77rem;
      font-family: "IBM Plex Mono", monospace;
      cursor: pointer;
      min-width: 88px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .ghost-btn[aria-expanded="true"] {
      border-color: rgba(42, 213, 158, 0.6);
      background: rgba(19, 63, 52, 0.86);
    }

    .ghost-btn:hover {
      border-color: rgba(42, 213, 158, 0.55);
    }

    .system-panel {
      border-bottom: 1px solid var(--line-soft);
      background: rgba(10, 22, 33, 0.8);
      max-height: 180px;
      overflow: hidden;
      transition: max-height 0.2s ease, opacity 0.2s ease;
      opacity: 1;
    }

    .system-panel.is-hidden {
      max-height: 0;
      opacity: 0;
      border-bottom: 0;
    }

    .system-grid {
      padding: 10px 14px;
      display: grid;
      gap: 8px;
      grid-template-columns: minmax(0, 1fr) minmax(180px, auto);
      align-items: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--text-muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      width: fit-content;
      max-width: 100%;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f5c542;
      box-shadow: 0 0 10px rgba(245, 197, 66, 0.7);
      flex-shrink: 0;
    }

    .status-dot.ok {
      background: var(--accent);
      box-shadow: 0 0 10px rgba(42, 213, 158, 0.8);
    }

    .status-dot.error {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(255, 119, 119, 0.8);
    }

    .system-note {
      text-align: right;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-family: "IBM Plex Mono", monospace;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 320px);
      overflow: hidden;
    }

    .app.people-hidden .workspace {
      grid-template-columns: minmax(0, 1fr);
    }

    .chat-panel {
      min-height: 0;
      border-right: 1px solid var(--line-soft);
      overflow: hidden;
    }

    .app.people-hidden .chat-panel {
      border-right: 0;
    }

    .chat {
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-gutter: stable;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar,
    .participants-list::-webkit-scrollbar {
      width: 10px;
    }

    .chat::-webkit-scrollbar-track,
    .participants-list::-webkit-scrollbar-track {
      background: rgba(8, 18, 30, 0.7);
      border-radius: 999px;
    }

    .chat::-webkit-scrollbar-thumb,
    .participants-list::-webkit-scrollbar-thumb {
      background: rgba(117, 169, 214, 0.52);
      border-radius: 999px;
    }

    .message {
      width: fit-content;
      max-width: min(82ch, 90%);
      border-radius: 14px;
      border: 1px solid var(--line-soft);
      padding: 10px 12px;
      animation: reveal 0.22s ease;
    }

    .message-user {
      align-self: flex-end;
      background: linear-gradient(160deg, rgba(35, 69, 104, 0.95), rgba(24, 51, 85, 0.95));
      border-bottom-right-radius: 4px;
    }

    .message-assistant {
      align-self: flex-start;
      background: linear-gradient(160deg, rgba(22, 54, 47, 0.95), rgba(13, 45, 37, 0.95));
      border-bottom-left-radius: 4px;
    }

    .message-system {
      align-self: center;
      background: rgba(32, 50, 69, 0.7);
      border-style: dashed;
      text-align: center;
      max-width: min(72ch, 95%);
    }

    .message-error {
      border-color: rgba(255, 119, 119, 0.64);
      background: rgba(77, 23, 26, 0.85);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.72rem;
      margin-bottom: 6px;
      font-family: "IBM Plex Mono", monospace;
    }

    .body {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .people-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: linear-gradient(180deg, rgba(18, 35, 51, 0.74), rgba(12, 27, 40, 0.78));
      overflow: hidden;
    }

    .app.people-hidden .people-panel {
      display: none;
    }

    .participants-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(9, 20, 32, 0.56);
    }

    .participants-title {
      margin: 0;
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      font-family: "IBM Plex Mono", monospace;
      color: var(--text-muted);
    }

    .participants-count {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      color: #d4fff0;
      border: 1px solid rgba(42, 213, 158, 0.42);
      border-radius: 999px;
      min-width: 26px;
      text-align: center;
      padding: 2px 8px;
      background: rgba(24, 62, 51, 0.62);
    }

    .participants-list {
      margin: 0;
      padding: 10px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      min-height: 0;
      scrollbar-gutter: stable;
    }

    .participant-item {
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(17, 39, 58, 0.86);
    }

    .participant-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .participant-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 7px rgba(42, 213, 158, 0.78);
      flex-shrink: 0;
    }

    .participant-name {
      font-size: 0.84rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .participant-state {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .participant-empty {
      border-style: dashed;
      justify-content: center;
      text-align: center;
      color: var(--text-muted);
      background: rgba(16, 35, 52, 0.65);
    }

    .composer {
      padding: 12px;
      border-top: 1px solid var(--line-soft);
      background: rgba(8, 18, 30, 0.88);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    .composer textarea {
      width: 100%;
      min-height: 50px;
      max-height: 160px;
      border-radius: 12px;
      border: 1px solid var(--line-strong);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 12px;
      font-size: 0.94rem;
      line-height: 1.4;
      resize: none;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
    }

    .composer textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(42, 213, 158, 0.2);
    }

    .composer button {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      min-height: 50px;
      min-width: 112px;
      background: linear-gradient(160deg, var(--accent), var(--accent-strong));
      color: #032218;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-family: "IBM Plex Mono", monospace;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    .composer button:hover {
      filter: brightness(1.06);
    }

    .composer button:active {
      transform: translateY(1px);
    }

    .composer button:disabled {
      filter: saturate(0.42) brightness(0.82);
      cursor: not-allowed;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 920px) {
      body {
        padding: 0;
      }

      .app {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
      }

      .header {
        padding: 12px;
      }

      .system-grid {
        grid-template-columns: 1fr;
      }

      .system-note {
        text-align: left;
      }

      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .chat-panel {
        border-right: 0;
        border-bottom: 1px solid var(--line-soft);
      }

      .people-panel {
        max-height: 210px;
      }

      .app.people-hidden .workspace {
        grid-template-rows: minmax(0, 1fr);
      }

      .message {
        max-width: 95%;
      }

      .composer {
        padding: 10px;
        padding-bottom: calc(10px + env(safe-area-inset-bottom));
        grid-template-columns: 1fr;
      }

      .composer button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="app">
    <header class="header">
      <div class="brand">
        <h1>TITAN ULTIMATE</h1>
        <p>Sade arayuz: panelleri ac kapat, alanlar kaydirilabilir</p>
      </div>
      <div class="header-actions">
        <button id="toggle-system" class="ghost-btn" type="button" aria-expanded="false">Sistem Ac</button>
        <button id="toggle-people" class="ghost-btn" type="button" aria-expanded="true">Kisiler Kapat</button>
      </div>
    </header>

    <section id="system-panel" class="system-panel is-hidden">
      <div class="system-grid">
        <div class="status" aria-live="polite">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Backend kontrol ediliyor...</span>
        </div>
        <div class="system-note">Enter gonderir, Shift+Enter alt satir acar.</div>
      </div>
    </section>

    <section class="workspace">
      <section class="chat-panel">
        <section id="chat" class="chat" aria-live="polite" aria-label="Mesaj listesi"></section>
      </section>

      <aside id="people-panel" class="people-panel" aria-label="Odadaki bagli kisiler">
        <div class="participants-head">
          <h2 class="participants-title">ODADAKI BAGLI KISILER</h2>
          <span id="participants-count" class="participants-count">0</span>
        </div>
        <ul id="participants-list" class="participants-list"></ul>
      </aside>
    </section>

    <form id="chat-form" class="composer" autocomplete="off">
      <textarea
        id="message-input"
        placeholder="Mesajini yaz."
        maxlength="3000"
        required
      ></textarea>
      <button id="send-button" type="submit">GONDER</button>
    </form>
  </main>

  <script>
    const appEl = document.getElementById("app");
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("message-input");
    const sendButtonEl = document.getElementById("send-button");
    const statusDotEl = document.getElementById("status-dot");
    const statusTextEl = document.getElementById("status-text");
    const participantsListEl = document.getElementById("participants-list");
    const participantsCountEl = document.getElementById("participants-count");
    const systemPanelEl = document.getElementById("system-panel");
    const toggleSystemBtnEl = document.getElementById("toggle-system");
    const togglePeopleBtnEl = document.getElementById("toggle-people");

    const participants = new Set(["SEN", "TITAN"]);

    function nowLabel() {
      return new Date().toLocaleTimeString("tr-TR", {
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function setSending(isSending) {
      sendButtonEl.disabled = isSending;
      inputEl.disabled = isSending;
      sendButtonEl.textContent = isSending ? "BEKLE" : "GONDER";
    }

    function resizeInput() {
      inputEl.style.height = "auto";
      inputEl.style.height = `${Math.min(inputEl.scrollHeight, 160)}px`;
    }

    function setBackendStatus(ok, text) {
      statusDotEl.classList.remove("ok", "error");
      statusDotEl.classList.add(ok ? "ok" : "error");
      statusTextEl.textContent = text;
    }

    function setSystemPanel(open) {
      systemPanelEl.classList.toggle("is-hidden", !open);
      toggleSystemBtnEl.setAttribute("aria-expanded", String(open));
      toggleSystemBtnEl.textContent = open ? "Sistem Kapat" : "Sistem Ac";
    }

    function setPeoplePanel(open) {
      appEl.classList.toggle("people-hidden", !open);
      togglePeopleBtnEl.setAttribute("aria-expanded", String(open));
      togglePeopleBtnEl.textContent = open ? "Kisiler Kapat" : "Kisiler Ac";
    }

    function normalizeParticipantName(name) {
      return String(name || "").trim();
    }

    function addParticipant(name) {
      const cleaned = normalizeParticipantName(name);
      if (!cleaned) return;
      participants.add(cleaned);
      renderParticipants();
    }

    function createParticipantItem(name) {
      const li = document.createElement("li");
      li.className = "participant-item";

      const meta = document.createElement("div");
      meta.className = "participant-meta";

      const dot = document.createElement("span");
      dot.className = "participant-dot";

      const nameEl = document.createElement("span");
      nameEl.className = "participant-name";
      nameEl.textContent = name;

      meta.append(dot, nameEl);

      const state = document.createElement("span");
      state.className = "participant-state";
      state.textContent = "ONLINE";

      li.append(meta, state);
      return li;
    }

    function renderParticipants() {
      const list = Array.from(participants).filter(Boolean);
      participantsListEl.textContent = "";
      participantsCountEl.textContent = String(list.length);

      if (!list.length) {
        const empty = document.createElement("li");
        empty.className = "participant-item participant-empty";
        empty.textContent = "Bagli kisi gorunmuyor";
        participantsListEl.appendChild(empty);
        return;
      }

      for (const name of list) {
        participantsListEl.appendChild(createParticipantItem(name));
      }
    }

    function createMessage(kind, author, text, options = {}) {
      const article = document.createElement("article");
      article.className = "message";

      if (kind === "user") {
        article.classList.add("message-user");
      } else if (kind === "assistant") {
        article.classList.add("message-assistant");
      } else {
        article.classList.add("message-system");
      }

      if (options.error) {
        article.classList.add("message-error");
      }

      const meta = document.createElement("div");
      meta.className = "meta";

      const nameEl = document.createElement("span");
      nameEl.textContent = author;

      const timeEl = document.createElement("span");
      timeEl.textContent = nowLabel();

      meta.append(nameEl, timeEl);

      const body = document.createElement("p");
      body.className = "body";
      body.textContent = text;

      article.append(meta, body);
      chatEl.appendChild(article);
      scrollToBottom();

      if (kind === "user" || kind === "assistant") {
        addParticipant(author);
      }

      return article;
    }

    async function checkHealth() {
      try {
        const response = await fetch("/api/health", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Backend cevap vermedi.");
        }

        const data = await response.json();
        setBackendStatus(true, `${data.model} hazir`);

        if (Array.isArray(data.participants)) {
          for (const name of data.participants) {
            addParticipant(name);
          }
        }
      } catch (error) {
        setBackendStatus(false, "Backend baglantisi hatali");
      }
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      createMessage("user", "SEN", message);
      inputEl.value = "";
      resizeInput();
      setSending(true);

      const loadingNode = createMessage("assistant", "TITAN", "Dusunuyorum...");

      try {
        const response = await fetch("/api/sor", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ msg: message }),
        });

        const data = await response.json();
        loadingNode.remove();

        if (!response.ok) {
          const errorText = data.error || data.detail || "Bilinmeyen hata";
          createMessage("system", "HATA", errorText, { error: true });
          return;
        }

        createMessage("assistant", "TITAN", data.cevap || "Bos cevap dondu.");
      } catch (error) {
        loadingNode.remove();
        createMessage("system", "HATA", "Sunucuya ulasilamadi.", { error: true });
      } finally {
        setSending(false);
        inputEl.focus();
      }
    }

    formEl.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    inputEl.addEventListener("input", resizeInput);

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    toggleSystemBtnEl.addEventListener("click", () => {
      const open = toggleSystemBtnEl.getAttribute("aria-expanded") !== "true";
      setSystemPanel(open);
    });

    togglePeopleBtnEl.addEventListener("click", () => {
      const open = togglePeopleBtnEl.getAttribute("aria-expanded") !== "true";
      setPeoplePanel(open);
    });

    if (window.innerWidth <= 920) {
      setPeoplePanel(false);
    } else {
      setPeoplePanel(true);
    }
    setSystemPanel(false);

    createMessage("system", "SISTEM", "Sohbet paneli hazir. Mesaj yazabilirsin.");
    renderParticipants();
    checkHealth();
    resizeInput();
    inputEl.focus();
  </script>
</body>
</html>
